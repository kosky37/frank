name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck / lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Frank.Api/Frank.Api.csproj

      - name: Build
        run: dotnet build Frank.Api/Frank.Api.csproj --no-restore -c Release

      - name: Test
        run: dotnet test Frank.Api.Tests/Frank.Api.Tests.csproj -c Release
